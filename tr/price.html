<body><section class="pg-boilerplate pgheader" id="pg-header" lang="en">

<hr style="width: 65%;">
<h1>Trade</h1>
<h2 class="no-break">masara</h2>
<hr style="width: 65%;">
<center>
<main>

<div class="container">
    <h1>Price Calculator</h1>
    <p>Calculate Price After Ratio.</p>

    <div class="input-group">
      <label>Price: $</label>
      <input type="d" id="firstInput" required>
    </div>
    <div class="input-group">
      <label>Ratio: %</label>
      <input type="d" id="secondInput" required>
    </div>
    <button onclick="addNumbers()">Find Price</button>
    <input id="result" />
  </div>
   

<script>
      function addNumbers() {
        var first, second;

        first = Number(document.getElementById("firstInput").value);
        second = Number(document.getElementById("secondInput").value);

        document.getElementById("result").value = first * second * 1 / 100 + first;
      }
    </script>
  </body>
