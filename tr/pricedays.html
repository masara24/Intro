<body><section class="pg-boilerplate pgheader" id="pg-header" lang="en">

<hr style="width: 65%;">
<h1>Trade</h1>
<h2 class="no-break">masara</h2>
<hr style="width: 65%;">
<center>
<main>

<div class="container">
    <h1>Calculate Nights Between Dates</h1>
    <div class="input-group">
      <label for="date1">Start Date:</label>
      <input type="date" id="date1" required>
    </div>
    <div class="input-group">
      <label for="date2">End Date:</label>
      <input type="date" id="date2" required>
    </div>
    <button id="calculateBtn">Calculate Nights</button>
    <div id="result"></div>
  </div>
 
  <script>
    // Get DOM elements
    const date1Input = document.getElementById("date1");
    const date2Input = document.getElementById("date2");
    const calculateBtn = document.getElementById("calculateBtn");
    const resultDiv = document.getElementById("result");
 
    // Manual date parser (avoids time zone issues)
    function parseDate(dateStr) {
      const [year, month, day] = dateStr.split("-").map(Number);
      return new Date(year, month - 1, day); // Month is 0-based
    }
 
    // Calculate
    function dateDiffInDays(date1, date2) {
      const timeDiff = Math.abs(date2.getTime() - date1.getTime());
      return Math.floor(timeDiff / (1000 * 60 * 60 * 24));
    }
 
    // Handle button click
    function calculateDays() {
      const date1Str = date1Input.value;
      const date2Str = date2Input.value;
 
      // Validate input presence
      if (!date1Str || !date2Str) {
        resultDiv.textContent = "Error: Please select both dates.";
        resultDiv.style.color = "red";
        return;
      }
 
      // Parse dates
      const date1 = parseDate(date1Str);
      const date2 = parseDate(date2Str);
 
      // Validate date objects
      if (isNaN(date1.getTime()) || isNaN(date2.getTime())) {
        resultDiv.textContent = "Error: Invalid date format.";
        resultDiv.style.color = "red";
        return;
      }
 
      // Calculate and display result
      const days = dateDiffInDays(date1, date2);
      resultDiv.textContent = `Nights between dates: ${days}`;
      resultDiv.style.color = "green";
    }
 
    // Add event listener
    calculateBtn.addEventListener("click", calculateDays);
  </script>
</body>
